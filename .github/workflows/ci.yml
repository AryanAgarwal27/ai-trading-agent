name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin uv once for every job (Stage 10a — reproducible builds from uv.lock).
env:
  UV_VERSION: "0.11.3"

jobs:
  lint-typecheck-test:
    name: ruff + mypy + pytest unit
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # BRD §4: Python 3.12 recommended; 3.11 and 3.13 also OK. Test all three.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Stage 10a drift guard: fail the build if pyproject.toml was edited
      # without re-running `uv lock`. `--locked` asserts the existing uv.lock
      # already satisfies pyproject and refuses to update it — so a stale lock
      # is a hard error here, not a silent re-resolve.
      - name: Assert uv.lock is in sync with pyproject (drift guard)
        run: uv lock --locked

      # Install the EXACT locked versions onto the matrix interpreter.
      # only-system pins resolution to the setup-python install (no uv-managed
      # Python download), so the matrix version is the one actually exercised.
      - name: Sync locked deps (project + dev group)
        run: uv sync --locked --group dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          UV_PYTHON_PREFERENCE: only-system

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: mypy (strict, orchestrator + tests)
        # Non-blocking until Stage 10b cleanup (SPEC change-log 2026-05-28:
        # "trust CI, deferred to Stage 10"). With the 10a lockfile, local and
        # CI now resolve IDENTICAL versions, so the count is stable (129 errors
        # at 10a baseline) — the flip to blocking is 10b's milestone. ruff
        # lint/format + pytest remain blocking.
        continue-on-error: true
        run: uv run mypy orchestrator tests

      - name: pytest unit (exclude integration)
        run: uv run pytest -m "not integration" tests/unit

  # ── Integration job (Stage 9g, closes DEFERRED.md D-7) ────────────────
  # Runs the integration suite against REAL postgres + redis service
  # containers — the gap D-7 named: ~84 integration tests had never run in
  # CI. Separate job (not the unit matrix): Python 3.13 only, because
  # integration exercises service/wiring behavior, not Python-version-
  # specific language features (the unit matrix covers 3.11-3.13). Ruff +
  # mypy are NOT re-run here — they are version-agnostic and already gated
  # by the unit job; re-running them would be pure redundancy.
  integration:
    name: pytest integration (postgres + redis)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      # pgvector/pgvector:pg15 = postgres:15 + pgvector, matching the local
      # docker-compose stack and BRD §5.8 — local↔CI DB-image parity so
      # "passes locally" implies "passes in CI" (the whole point of D-7).
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ait
          POSTGRES_PASSWORD: ait
          POSTGRES_DB: ai_trading_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ait -d ai_trading_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked deps (project + dev group)
        run: uv sync --locked --group dev
        env:
          UV_PYTHON: "3.13"
          UV_PYTHON_PREFERENCE: only-system

      - name: Alembic upgrade head
        env:
          # DATABASE_URL takes the postgresql+psycopg:// SQLAlchemy dialect
          # (alembic env.py + SQLAlchemy). The two LANGGRAPH_* URIs below use
          # RAW postgresql:// — AsyncPostgresSaver/Store.from_conn_string pass
          # the URI straight to psycopg, which rejects the +psycopg dialect
          # ("missing = ... in connection info"). This split mirrors .env and
          # was caught by running the suite against real services in 9g.
          DATABASE_URL: postgresql+psycopg://ait:ait@localhost:5432/ai_trading_agent
        run: uv run alembic upgrade head

      - name: pytest integration (exclude @freqtrade real-spawn subset)
        env:
          DATABASE_URL: postgresql+psycopg://ait:ait@localhost:5432/ai_trading_agent
          LANGGRAPH_CHECKPOINT_URI: postgresql://ait:ait@localhost:5432/ai_trading_agent
          LANGGRAPH_STORE_URI: postgresql://ait:ait@localhost:5432/ai_trading_agent
          REDIS_URL: redis://localhost:6379/0
          OPERATOR_TOKEN: ci-stub-token
          ANTHROPIC_API_KEY: ci-stub-key
          # Explicit intent; conftest.py forces this to "memory" for every test
          # regardless, so no integration test exercises (or depends on) the
          # production SQLAlchemy jobstore.
          AIT_SCHEDULER_JOBSTORE: memory
          # Deliberately NOT set: AIT_RUN_REAL_SPAWN_TESTS /
          # AIT_RUN_REAL_LIVE_SPAWN_TESTS — the @freqtrade real-spawn subset
          # (6 tests) stays opt-in even in CI and is excluded by the marker below.
        run: uv run pytest -m "integration and not freqtrade" -v
